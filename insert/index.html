<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDeal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-title"><a href="#">IDeal</a></div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">All Products</a></li>
          <li><a href="./index.html">Insert Product</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Product</h1>
      <form id="productForm" class="product-form">
        <input type="text" id="productName" placeholder="Product Name:" />
        <input type="imgUrl" id="imgUrl" placeholder="ImgUrl:" />
        <textarea id="description" placeholder="Description:"></textarea>
        <input type="price" id="price" placeholder="price:" />
        <input
          type="text"
          id="saleLocationUrl"
          placeholder="Google Maps embed link (from Share → Embed a map)"
        />

        <button type="submit" id="btnSubmit">Submit Product</button>
      </form>
      <button id="btnArrowBack" type="">
        <img
          src="./img/arrow-left-solid-white.svg"
          alt="arrow-left-svg"
          class="arrow-white"
        />
        <img
          src="./img/arrow-left-solid-black.svg"
          alt=""
          class="arrow-black"
        />
      </button>
      <div id="message"></div>
    </main>
    <script src="./script.js" type="module"></script>
  </body>
</html>
