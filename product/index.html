<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="../index.html">All Cars</a></li>
          <li><a href="../insert/index.html">Insert</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="card">
        <h1 id="productName"></h1>
        <img id="imgUrl" src="" alt="Car Image" />
        <p id="description"></p>
        <p id="price"></p>
        <div id="saleLocationUrl">
          <span class="sellLocationText">Sell Location :</span>
          <iframe
            id="googleMap"
            width="400"
            height="200"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>

        <button id="btnDelete" class="btnDelete">Delete</button>
        <h4 id="message" class="message"></h4>
      </div>
    </main>
  </body>
  <script src="./script.js" type="module"></script>
</html>
